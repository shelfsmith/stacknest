name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install libarchive (Phase 2.5b ArchiveAdapter build-time headers)
        run: brew install libarchive

      # G28/G30: コンパイルに使うヘッダを、実行時にリンクされる Apple 版と同じバージョンへ揃える。
      # 新規クローンには vendor/ が無い（.gitignore 済）ため、これを飛ばすと Homebrew のヘッダで
      # コンパイルされ、LibarchiveVersionTests が**設計どおり失敗する**（未取得を知らせるのが目的）。
      - name: Fetch libarchive headers matching the runtime library
        run: ./Scripts/fetch-libarchive-headers.sh

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -c debug

      # G55: CI runners are en_US, but the existing tests assert the Japanese UI text.
      # Pin the process language so they keep testing the source language.
      - name: Test
        env:
          STACKNEST_LANG: ja
        run: swift test --parallel

      # G55: report mode (exit 0). No App build in this job, so the stringsdata checks are skipped;
      # the build-app job runs them against the extracted strings. Task 17 adds --strict.
      - name: Localization lint (report)
        run: |
          python3 -m unittest Scripts/tests/test_l10n_lint.py
          python3 Scripts/l10n-lint.py --stringsdata-root /nonexistent

      # A bare directory argument (`node --test web-tests/`) fails on Node 22+ ("Cannot find module");
      # let the shell expand the files so it works on every Node version.
      - name: Web tests
        run: node --test web-tests/*.mjs

  build-app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (xcodegen + libarchive)
        run: brew install xcodegen libarchive

      # G28/G30: 上の test ジョブと同じ理由。App 層のテストにも版一致テストがあり
      # （`swift test` は App ターゲットを見ないため別途必要）、vendor/ が無いと失敗する。
      - name: Fetch libarchive headers matching the runtime library
        run: ./Scripts/fetch-libarchive-headers.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec App/project.yml --use-cache

      # G25e: App 層のユニットテスト。`swift test` は App ターゲットを一切見ないため、
      # このステップが無いと App 層の回帰（例: G25d で混入した presentRemoteError の自己再帰＝
      # 失効以外の全通信エラーでクラッシュ）を CI が素通りする。実際 SPM の全テストも
      # App の通常ビルドも、その自己再帰を検出できなかった。
      # テストはホスト arch で十分（製品ビルドの Universal は下の step で別途行う）。
      # 注: この workflow は 2026-07-31 時点で GitHub 側で disabled_manually。
      # 再有効化したときに正しく回るよう用意している（現状このステップは実行されない）。
      - name: Test macOS App (app-layer unit tests)
        run: |
          xcodebuild \
            -project App/StackNest.xcodeproj \
            -scheme StackNest \
            -configuration Debug \
            -destination 'platform=macOS' \
            -testLanguage ja \
            -testRegion JP \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            test

      # G55: the build above ran with SWIFT_EMIT_LOC_STRINGS=YES, so the App checks can run here.
      # This job uses the default DerivedData (no -derivedDataPath), so ask xcodebuild for OBJROOT
      # (= <DerivedData>/Build/Intermediates.noindex) instead of assuming App/build.
      - name: Localization lint with extracted strings (report)
        run: |
          OBJROOT="$(xcodebuild -project App/StackNest.xcodeproj -scheme StackNest -configuration Debug -showBuildSettings 2>/dev/null | awk -F' = ' '/^ *OBJROOT = /{print $2; exit}')"
          python3 Scripts/l10n-lint.py --stringsdata-root "$OBJROOT"

      - name: Build macOS App (Universal)
        run: |
          xcodebuild \
            -project App/StackNest.xcodeproj \
            -scheme StackNest \
            -configuration Debug \
            -destination 'platform=macOS' \
            ARCHS='x86_64 arm64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build
