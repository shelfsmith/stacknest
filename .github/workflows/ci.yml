name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install libarchive (Phase 2.5b ArchiveAdapter build-time headers)
        run: brew install libarchive

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test --parallel

  build-app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (xcodegen + libarchive)
        run: brew install xcodegen libarchive

      - name: Generate Xcode project
        run: xcodegen generate --spec App/project.yml --use-cache

      - name: Build macOS App (Universal)
        run: |
          xcodebuild \
            -project App/StackNest.xcodeproj \
            -scheme StackNest \
            -configuration Debug \
            -destination 'platform=macOS' \
            ARCHS='x86_64 arm64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build
