name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install libarchive (Phase 2.5b ArchiveAdapter build-time headers)
        run: brew install libarchive

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test --parallel

  build-app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (xcodegen + libarchive)
        run: brew install xcodegen libarchive

      - name: Generate Xcode project
        run: xcodegen generate --spec App/project.yml --use-cache

      # G25e: App 層のユニットテスト。`swift test` は App ターゲットを一切見ないため、
      # このステップが無いと App 層の回帰（例: G25d で混入した presentRemoteError の自己再帰＝
      # 失効以外の全通信エラーでクラッシュ）を CI が素通りする。実際 SPM の全テストも
      # App の通常ビルドも、その自己再帰を検出できなかった。
      # テストはホスト arch で十分（製品ビルドの Universal は下の step で別途行う）。
      # 注: この workflow は 2026-07-31 時点で GitHub 側で disabled_manually。
      # 再有効化したときに正しく回るよう用意している（現状このステップは実行されない）。
      - name: Test macOS App (app-layer unit tests)
        run: |
          xcodebuild \
            -project App/StackNest.xcodeproj \
            -scheme StackNest \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build macOS App (Universal)
        run: |
          xcodebuild \
            -project App/StackNest.xcodeproj \
            -scheme StackNest \
            -configuration Debug \
            -destination 'platform=macOS' \
            ARCHS='x86_64 arm64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build
