name: Release

# タグ `vX.Y.Z` を push するとリリースビルド（ad-hoc 署名 Universal）を作り、
# GitHub Release を作成して zip を添付する。リポジトリは public のためリリースも公開される。
# `-` 付きサフィックスのタグ（例 v0.12.0-rc.1）は semver プレリリースとして prerelease 扱いになる。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ (例: v0.8.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # 信頼できない可能性のある入力（タグ名）は env 経由で受け、run 内で ${{ }} 直挿しを避ける。
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          # 形式検証（vX.Y.Z[-suffix] のみ許可）。
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid tag format: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # `vX.Y.Z-...`（ハイフン付きサフィックス＝semver プレリリース）はプレリリース扱いにする。
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies (xcodegen + libarchive)
        run: brew install xcodegen libarchive

      - name: Generate Xcode project
        run: xcodegen generate --spec App/project.yml --use-cache

      - name: Build Release (Universal, ad-hoc signed)
        run: |
          xcodebuild \
            -project App/StackNest.xcodeproj \
            -scheme StackNest \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Verify universal binary
        run: lipo -info build/Build/Products/Release/StackNest.app/Contents/MacOS/StackNest

      # xcodebuild は helper（stacknest-cli）を作らない/埋め込まないため、ここで Universal に
      # ビルドして Contents/Helpers/ へ同梱する。埋め込みで app の ad-hoc 署名が無効化されるので、
      # helper→app の順で再署名する（怠ると配布 .app が Gatekeeper で開けない）。
      - name: Build & embed universal helper (ad-hoc signed)
        run: |
          set -euo pipefail
          swift build -c release --arch x86_64 --arch arm64 --product stacknest-cli
          APP="build/Build/Products/Release/StackNest.app"
          mkdir -p "$APP/Contents/Helpers"
          cp .build/apple/Products/Release/stacknest-cli "$APP/Contents/Helpers/stacknest-cli"
          lipo -info "$APP/Contents/Helpers/stacknest-cli"   # 期待: x86_64 arm64
          codesign --force --sign - "$APP/Contents/Helpers/stacknest-cli"
          codesign --force --sign - --preserve-metadata=entitlements,requirements,flags "$APP"
          codesign --verify --strict "$APP"

      - name: Package app (zip, preserve bundle)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ditto -c -k --keepParent \
            build/Build/Products/Release/StackNest.app \
            "StackNest-${TAG}.zip"

      - name: Create GitHub Release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          [ "$PRERELEASE" = "true" ] && flag="--prerelease"
          gh release create "$TAG" \
            "StackNest-${TAG}.zip" \
            --title "StackNest $TAG" \
            $flag \
            --notes "$(cat <<'EOF'
          ad-hoc 署名（Apple 公証なし）の Universal ビルド（arm64 + x86_64・macOS 15+）。

          ## インストール
          ダウンロードした `StackNest.app` を `/Applications` などへ展開し、**初回のみ**許可操作が必要です（2 回目以降は通常起動）。

          **macOS 15 Sequoia 以降は「右クリック →『開く』」での回避が廃止されています。** 次のいずれかで開いてください:

          - **システム設定から許可**: アプリをダブルクリック →「開けません」→ **システム設定 → プライバシーとセキュリティ** の「セキュリティ」セクションで **「このまま開く」** → 認証（Touch ID / パスワード）→ 再度「このまま開く」。
          - **ターミナル**: `xattr -dr com.apple.quarantine /Applications/StackNest.app` を実行してからダブルクリック。

          ⚠ 未公証のため Gatekeeper の警告が出ます。信頼できる入手元からのみ導入してください。
          EOF
          )"
