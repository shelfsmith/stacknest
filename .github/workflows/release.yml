name: Release

# タグ `vX.Y.Z` を push するとリリースビルド（自己署名・匿名 CN「StackNest Self-Signed」・Universal）を作り、
# GitHub Release を作成して zip を添付する。リポジトリは public のためリリースも公開される。
# `-` 付きサフィックスのタグ（例 v0.12.0-rc.1）は semver プレリリースとして prerelease 扱いになる。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ (例: v0.8.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # 信頼できない可能性のある入力（タグ名）は env 経由で受け、run 内で ${{ }} 直挿しを避ける。
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          # 形式検証（vX.Y.Z[-suffix] のみ許可）。
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid tag format: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # `vX.Y.Z-...`（ハイフン付きサフィックス＝semver プレリリース）はプレリリース扱いにする。
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate (self-signed, anonymous)
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -A
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          echo "SIGN_ID=StackNest Self-Signed" >> "$GITHUB_ENV"

      - name: Install dependencies (xcodegen + libarchive)
        run: brew install xcodegen libarchive

      - name: Generate Xcode project
        run: xcodegen generate --spec App/project.yml --use-cache

      # xcodebuild 自体は ad-hoc/未署名でビルドする（キーチェーン経由の identity 指定は provisioning
      # まわりで失敗しやすく不安定なため）。実際の「StackNest Self-Signed」署名は、helper 埋め込み後の
      # 明示 codesign ステップでまとめて行う（下記）。
      - name: Build Release (Universal, unsigned intermediate)
        run: |
          xcodebuild \
            -project App/StackNest.xcodeproj \
            -scheme StackNest \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Verify universal binary
        run: lipo -info build/Build/Products/Release/StackNest.app/Contents/MacOS/StackNest

      # xcodebuild は helper（stacknest-cli）を作らない/埋め込まないため、ここで Universal に
      # ビルドして Contents/Helpers/ へ同梱する。埋め込みで app の ad-hoc 署名が無効化されるので、
      # helper→app の順で「StackNest Self-Signed」（固定・匿名 identity）で再署名する
      # （怠ると配布 .app が Gatekeeper で開けない上、identity が固定されず TCC 権限が更新のたびに失われる）。
      - name: Build & embed universal helper (sign with self-signed identity)
        run: |
          set -euo pipefail
          swift build -c release --arch x86_64 --arch arm64 --product stacknest-cli
          APP="build/Build/Products/Release/StackNest.app"
          mkdir -p "$APP/Contents/Helpers"
          cp .build/apple/Products/Release/stacknest-cli "$APP/Contents/Helpers/stacknest-cli"
          lipo -info "$APP/Contents/Helpers/stacknest-cli"   # 期待: x86_64 arm64
          codesign --force --sign "$SIGN_ID" "$APP/Contents/Helpers/stacknest-cli"
          codesign --force --sign "$SIGN_ID" --preserve-metadata=entitlements,requirements,flags "$APP"
          codesign --verify --strict "$APP"

      - name: Verify signature and anonymity
        run: |
          set -eu
          APP="build/Build/Products/Release/StackNest.app"
          codesign -dvvv "$APP" 2>&1 | grep -q "Authority=StackNest Self-Signed" \
            || { echo "::error::unexpected signing authority"; exit 1; }
          lipo -info "$APP/Contents/MacOS/StackNest" | grep -q "x86_64 arm64" || { echo "::error::not universal"; exit 1; }
          # 個人情報リーク検査（実名・実メール・個人ホームパス）
          if strings "$APP/Contents/MacOS/StackNest" "$APP/Contents/Helpers/stacknest-cli" \
             | grep -Eiq "REDACTED_PATTERNS"; then
            echo "::error::personal info leak in binary"; exit 1
          fi

      - name: Package app (zip, preserve bundle)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ditto -c -k --keepParent \
            build/Build/Products/Release/StackNest.app \
            "StackNest-${TAG}.zip"

      - name: Create GitHub Release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          [ "$PRERELEASE" = "true" ] && flag="--prerelease"
          gh release create "$TAG" \
            "StackNest-${TAG}.zip" \
            --title "StackNest $TAG" \
            $flag \
            --notes "$(cat <<'EOF'
          自己署名（固定 identity・匿名 CN `StackNest Self-Signed`・Apple 公証なし）の Universal ビルド（arm64 + x86_64・macOS 15+）。
          固定 identity のため、アップデートしても TCC（フルディスクアクセス等）の許可がリセットされず持続します。

          ## インストール
          ダウンロードした `StackNest.app` を `/Applications` などへ展開し、**初回のみ**許可操作が必要です（2 回目以降は通常起動）。

          **macOS 15 Sequoia 以降は「右クリック →『開く』」での回避が廃止されています。** 次のいずれかで開いてください:

          - **システム設定から許可**: アプリをダブルクリック →「開けません」→ **システム設定 → プライバシーとセキュリティ** の「セキュリティ」セクションで **「このまま開く」** → 認証（Touch ID / パスワード）→ 再度「このまま開く」。
          - **ターミナル**: `xattr -dr com.apple.quarantine /Applications/StackNest.app` を実行してからダブルクリック。

          ⚠ 未公証のため Gatekeeper の警告が出ます。信頼できる入手元からのみ導入してください。
          EOF
          )"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
