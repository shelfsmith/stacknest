    post:
      summary: シェルフの作成（edit 以上）
      description: |
        手動の棚（`isSmart: false`）かスマートシェルフ（`isSmart: true`・`conditions` が要る）を作る。
        スマートシェルフで `conditions` が無ければ 400、手動の棚に `conditions` を付けたら 409。
        応答の `bookCount` は 0（数えるのは一覧だけ）。`settingsChanged` イベントを出す。
        **edit 以上の tier が必要。** 施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
      tags: [Shelves]
      operationId: createShelf
      x-stacknest-tier: edit
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      requestBody:
        required: true
        content:
          application/json:
