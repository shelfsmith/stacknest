      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelinkRequest'
      responses:
        '204':
          description: 付け直した
        '400':
          description: 本文が読めない・newPath が空
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

