      description: |
        本文の画像（そのままのバイト列・上限 30 MB）を表紙にする。サーバは `Content-Type` を見ず、画像として読めるかで判断する（読めない・空なら 400）。
        長い辺を 1200 ピクセル以内にした JPEG で保存し、表紙を外部の画像（`coverImageName` が `@external`）にする。
        `?crop=` に切り抜きの矩形の JSON を付けるとそれを設定し、付けなければ切り抜きを外す。
        `bookChanged` イベントを出す。**edit 以上の tier が必要。** 施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
