openapi: 3.1.0
info:
  title: StackNest API
  version: "1"
  description: |
    StackNest 画像ライブラリ管理サーバの HTTP API 仕様。

    **認証:**
    - 操作に要る権限（tier）は read < edit < admin の 3 段。操作ごとの必要な tier は各操作の `x-stacknest-tier` と説明にある。足りなければ 403。
    - **鍵の種類。**
      - グラントの鍵: tier と scope（全書庫、または決めた書庫だけ）を持つ。共有サーバはグラントのモードで動く。最初の鍵は、サーバを動かしているアプリのメニュー「共有」→「サーバ設定…」の「共有トークン」の節（アプリではグラントを共有トークンと呼ぶ）で「＋ 共有トークンを追加」から作り、その行の「トークンコピー」で写す（Web の画面は同じ行の「QR」を読むと、URL の `#token=` で鍵を受け取る）。API からは admin の鍵で `POST /grants`。
      - 固定の鍵（読み取り用と編集用）: グラントの無い口だけで照らす。共有サーバの昔の固定の鍵は、起動時にグラントへ移してある。127.0.0.1 の口では CLI の鍵がこれに当たり、admin の口なので admin になる。
      - セッションの鍵: `POST /session` に `Authorization: Bearer` で鍵を出して引き換える 30 分の鍵。`?token=` で渡したときだけ効く（ヘッダで出してもセッションとしては引かれない）。
      - 本専用の鍵（外部ビューア用）: その本の 4 つの道（manifest・pages・cover・progress）だけに通る。ヘッダだけで、`?token=` では通らない。
      - 中継の鍵: 127.0.0.1 の口の `/relay/{relayID}/` の 4 つの道だけに通る。ほかの鍵は read・edit・admin でも 403。
    - **渡し方。** ヘッダ `Authorization: Bearer <token>` が優先。`?token=<token>` も受け付け、セッションの鍵として引けなければグラント・固定の鍵として扱う（既存のクライアントとの互換）。`/api/v1/server/info` は認証不要。
    - **書庫の鍵。** 施錠した書庫の道は、`POST /libraries/{lib}/unlock` で得た鍵を `X-Library-Token`（または `?lt=`）で渡さないと 403 とヘッダ `X-Library-Locked: 1` を返す。例外として、本専用の鍵は、発行時の施錠の世代が今も同じなら、書庫の鍵なしでその本の道を通る。施錠の状態は毎回書庫の DB から読み、読めない（書庫を閉じた直後・読み取りの失敗）ときは 503（`X-Library-Locked` は付かない。送り直せば通ることがある）。
    - **範囲外の書庫は 404。** path に書庫を持つ道では、scope の外の書庫は、在るか無いかを漏らさないため 403 ではなく 404。例外: `GET /viewer-tokens/{tokenID}` は scope の外の書庫の記録に 403。グラントの作成・更新で、呼び手の権限を超える scope・tier を指定したら 403（在るグラントが scope の外なら 404）。
    - **tier の確認は書庫の解決より先。** 低い tier の鍵には、書庫や本の有無を返さない。
    - **`/local/*` の口。** 127.0.0.1 の口で「ローカルコントロールを許可」が ON のときだけある（admin。タグ `Local` を参照）。
    - **中継の道（`/relay/...`）。** 127.0.0.1 の口で中継を設定したときだけ存在する。中継の鍵だけが通る。

    **ネットワーク:**
    - LAN 内共有アクセスおよびローカルアクセス（API 専用）の両方に対応。
    - 本ドキュメント（`/docs`）および `/openapi.yaml` は認証不要で公開されるが、ライブラリのコンテンツは含まない。

    **日時フォーマット:** ISO 8601（例: `2024-01-15T10:30:00Z`）。

servers:
  - url: /api/v1
    description: StackNest API v1

security:
  - bearerAuth: []

components:
  # security の書き方: 施錠を見る操作（`/libraries/{lib}` と `/local/libraries/{uuid}` の下で
  # `x-stacknest-lock: none` でないもの。`/local` では今は rename-files だけで、finder-tags の 3 つは none）は、
  # 書庫の鍵つき（bearerAuth + libraryToken）と鍵なし（bearerAuth）の 2 通りを並べる。
  # 施錠を見ない操作は全体の既定（bearerAuth）のまま `security` を書かない。認証なしの操作だけ `security: []`。
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        read・edit・admin の 3 段のグラント、または固定の鍵。
        クエリパラメータ `?token=<token>` によるフォールバックも可。
        本専用の読み取りトークン（`POST /libraries/{lib}/books/{id}/viewer-token` で発行）は
        **`Authorization: Bearer` のヘッダでだけ**受け付ける（`?token=` のクエリでは 401）。
        本専用トークンで使えるのは、その本の `GET manifest`・`GET pages/{n}`・`GET cover`・`POST progress` だけ。
        127.0.0.1 の口がリモートの本の中継のために出す本専用トークン（中継のトークン）は、
        その中継の `/relay/{relayID}/` の同じ 4 つだけ（G60 v3 試用）。
    libraryToken:
      type: apiKey
      in: header
      name: X-Library-Token
      description: |
        ロック庫へのアクセスに必要な短命トークン。
        `POST /libraries/{lib}/unlock` で取得し、ヘッダ `X-Library-Token`、またはクエリ `?lt=<token>` で渡す（ヘッダが優先）。
        有効期間は発行から 24 時間（使っても延びない）。サーバの再起動、またはその書庫のパスワードの変更・解除で失効する。

  responses:
    Unauthorized:
      description: 鍵が無い、または無効（期限切れのセッションの鍵・失効した本専用の鍵を含む）
    Forbidden:
      description: 鍵の tier が足りない（中継の道では、中継の鍵でない）
    LibraryLocked:
      description: 施錠した書庫に、書庫の鍵（`X-Library-Token` ヘッダか `?lt=`）なしで来た
      headers:
        X-Library-Locked:
          description: 施錠による拒否のとき `1`
          schema:
            type: string
            enum: ['1']
    ForbiddenOrLocked:
      description: |
        鍵の tier が足りない、または施錠した書庫に書庫の鍵なしで来た。
        後者のときだけヘッダ `X-Library-Locked: 1` が付く。
      headers:
        X-Library-Locked:
          description: 施錠による拒否のとき `1`
          schema:
            type: string
            enum: ['1']
    NotFound:
      description: 書庫・本などが無い、または鍵の scope の外（在るか無いかを漏らさないため 403 ではなく 404）
    LibraryUnavailable:
      description: |
        書庫の施錠の状態を DB から読めなかった（書庫を閉じた直後・読み取りの失敗）。一時的なもので、送り直せば通ることがある。
        `X-Library-Locked` は付かない（書庫の鍵を捨てて解錠し直す必要はない）。

  schemas:
    ServerCapabilities:
      type: object
      description: サーバの機能情報（/server/info レスポンス）
      required: [version, fileOps, transcode, formats]
      properties:
        version:
          type: string
          description: API バージョン文字列
          example: "1"
        fileOps:
          type: boolean
          description: ファイル操作（書籍追加・削除）が可能か
        transcode:
          type: boolean
          description: 画像縮小（maxw パラメータ）が可能か
        formats:
          type: array
          items:
            type: string
          description: サポートするファイル形式
          example: ["zip", "rar", "7z", "tar", "folder", "image", "pdf"]

    MeReply:
      type: object
      description: 鍵の tier・互換の role・scope
      required: [role, tier, scope]
      properties:
        role:
          type: string
          enum: [read, write]
          description: '`tier` から導く互換の値（read → read、edit・admin → write）'
        tier:
          type: string
          enum: [read, edit, admin]
          description: 能力 tier（B1）。read < edit < admin
        scope:
          description: 鍵の範囲。全書庫は空のオブジェクト、決めた書庫だけなら libraries にその UUID の配列
          oneOf:
            - type: object
              maxProperties: 0
              description: 全書庫
            - type: object
              required: [libraries]
              properties:
                libraries:
                  type: array
                  items:
                    type: string

    LibraryDTO:
      type: object
      description: ライブラリ一覧の 1 件
      required: [id, name, locked, bookCount]
      properties:
        id:
          type: string
          description: ライブラリ UUID
        name:
          type: string
          description: ライブラリ名
        locked:
          type: boolean
          description: パスワードロックされているか（書庫の DB から読む。読めなければ true）
        bookCount:
          type: integer
          description: 書籍数

    BookRestoreDTO:
      type: object
      description: 削除した本の行（DELETE の応答。BookRow の全項目を可逆に運ぶ。日時は epoch 秒、方向は ltr / rtl）
      required: [id, title, dateAdded, bookType, fileType, rating, unseen]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: [string, 'null']
        genre:
          type: [string, 'null']
        path:
          type: [string, 'null']
        dateAdded:
          type: number
        playDate:
          type: [number, 'null']
        bookType:
          type: integer
        fileType:
          type: integer
        pages:
          type: [integer, 'null']
        rating:
          type: integer
        unseen:
          type: boolean
        keywordA:
          type: [string, 'null']
        keywordB:
          type: [string, 'null']
        keywordC:
          type: [string, 'null']
        neta:
          type: [string, 'null']
        memo:
          type: [string, 'null']
        series:
          type: [string, 'null']
        volume:
          type: [number, 'null']
        coverImageName:
          type: [string, 'null']
        coverCropX:
          type: [number, 'null']
        coverCropY:
          type: [number, 'null']
        coverCropW:
          type: [number, 'null']
        coverCropH:
          type: [number, 'null']
        pageDirection:
          type: [string, 'null']
        contentHash:
          type: [string, 'null']
        fileSize:
          type: [integer, 'null']
        fileMtime:
          type: [number, 'null']
        hasCover:
          type: [boolean, 'null']
          description: 削除時点で表紙があったか（restore がサムネイルを作り直すかの判断に使う）

    UnlockReply:
      type: object
      description: ロック庫解錠レスポンス（短命ライブラリトークン）
      required: [libraryToken]
      properties:
        libraryToken:
          type: string
          description: ロック庫アクセス用の短命トークン（発行から 24 時間で失効し、使っても延びない。サーバの再起動、その書庫のパスワードの変更・解除でも失効する）

    ViewerTokenReply:
      type: object
      description: 本専用の読み取りトークン（G60）。その本の manifest・pages・cover の取得と progress の書き込みだけができる
      required: [token, expiresAt, tokenID]
      properties:
        token:
          type: string
          description: Bearer で渡す。サーバはハッシュだけを保存する
        expiresAt:
          type: string
          format: date-time
          description: 有効期限（発行から 30 日）。過ぎると 401
        tokenID:
          type: string
          description: 秘密でないトークンの ID（G60 v3）。`GET /viewer-tokens/{tokenID}` で使われたかを確かめる

    ViewerTokenStatusReply:
      type: object
      description: 本専用トークンが使われたか（G60 v3）。まだ使われていなければ両方 null（キーは省かない）
      required: [firstUsedAt, viewer]
      properties:
        firstUsedAt:
          type: [string, 'null']
          format: date-time
          description: 初めて認証に通った日時（許可された道を通った要求だけを数える）
        viewer:
          type: [string, 'null']
          description: 初めて通った要求の `X-StackNest-Viewer`（印字できる ASCII だけ・最長 200 文字）。ヘッダが無ければ null

    BookListItemDTO:
      type: object
      description: 書籍一覧の 1 件
      required: [id, title, rating, unseen, bookType, dateAdded, hasCover]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: [string, 'null']
        series:
          type: [string, 'null']
        volume:
          type: [number, 'null']
          format: double
        rating:
          type: integer
          minimum: 0
          maximum: 5
        unseen:
          type: boolean
        bookType:
          type: integer
          description: 書籍種別コード（0-5）
        pages:
          type: [integer, 'null']
        lastPage:
          type: [integer, 'null']
          description: 最終閲覧ページ（未読は null）
        lastReadAt:
          type: [string, 'null']
          format: date-time
        dateAdded:
          type: string
          format: date-time
        hasCover:
          type: boolean
        coverVersion:
          type: [string, 'null']
          description: 表紙差し替え追跡用バージョン文字列（mtime+size 由来）
        coverCropRectJSON:
          type: [string, 'null']
          description: 表紙クロップ矩形 JSON（クロップ無しは null）
        filename:
          type: [string, 'null']
          description: サーバ側ファイルの basename（フルパスではない）。path を持たない本は null（G15 V3。Web は S3d から使う）
        genre:
          type: [string, 'null']
          description: "&fields=genre 要求時のみ返る"
        neta:
          type: [string, 'null']
          description: "&fields=neta 要求時のみ返る"
        keywordA:
          type: [string, 'null']
          description: "&fields=keywordA 要求時のみ返る"
        keywordB:
          type: [string, 'null']
          description: "&fields=keywordB 要求時のみ返る"
        keywordC:
          type: [string, 'null']
          description: "&fields=keywordC 要求時のみ返る"
        memo:
          type: [string, 'null']
          description: "&fields=memo 要求時のみ返る（先頭 200 字に切詰）"

    BookPageDTO:
      type: object
      description: 書籍一覧のページングレスポンス
      required: [items, total, page, perPage]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookListItemDTO'
        total:
          type: integer
          description: 総件数
        page:
          type: integer
          description: 現在ページ（1 始まり）
        perPage:
          type: integer
          description: 1 ページあたりの件数

    ShelfDTO:
      type: object
      description: 棚（ユーザー棚・スマート棚）の 1 件
      required: [id, title, kind, isSmart, bookCount]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        kind:
          type: string
        isSmart:
          type: boolean
        bookCount:
          type: integer
          description: 所属の冊数（手動の棚・お気に入りは所属の数、スマートシェルフは条件に合う数）。一覧（GET）だけが数え、作成・更新の応答では常に 0

    BookDetailDTO:
      type: object
      description: 書籍詳細（フルメタデータ）
      required: [id, title, rating, unseen, bookType, fileType, dateAdded]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: [string, 'null']
        genre:
          type: [string, 'null']
        path:
          type: [string, 'null']
          description: 常に null（パスはサーバ秘匿）
        dateAdded:
          type: string
          format: date-time
        playDate:
          type: [string, 'null']
          format: date-time
        bookType:
          type: integer
        fileType:
          type: integer
        pages:
          type: [integer, 'null']
        lastPage:
          type: [integer, 'null']
        epubLocator:
          description: EPUB の読書位置（viewer state 由来・G48-2）。EPUB 以外・未読・壊れた値はキー省略
          oneOf:
            - $ref: '#/components/schemas/EPUBLocatorDTO'
            - type: 'null'
        rating:
          type: integer
          minimum: 0
          maximum: 5
        unseen:
          type: boolean
        keywordA:
          type: [string, 'null']
        keywordB:
          type: [string, 'null']
        keywordC:
          type: [string, 'null']
        neta:
          type: [string, 'null']
        memo:
          type: [string, 'null']
        series:
          type: [string, 'null']
        volume:
          type: [number, 'null']
          format: double
        coverImageName:
          type: [string, 'null']
        coverCropRectJSON:
          type: [string, 'null']
        pageDirection:
          type: [string, 'null']
          enum: [rtl, ltr, null]
          description: '"rtl" | "ltr" | null（本ごと未設定時は null）'
        fileExtension:
          type: [string, 'null']
          description: ファイル拡張子（"zip"/"rar"/"pdf"/"" など）。パス秘匿のため拡張子のみ返す。
        filename:
          type: [string, 'null']
          description: 表示用のファイル名（拡張子込み・パスは含まない）。旧サーバには無い（G12b-3a）
        previous:
          description: PATCH 応答だけに付く、今回変更したフィールドの更新前の値（変更外は null）。他のエンドポイントではキー省略（G16 A2）
          oneOf:
            - $ref: '#/components/schemas/BookPatchDTO'
            - type: 'null'

    BookPatchDTO:
      type: object
      description: PATCH /books/:id のリクエスト（null フィールドは変更しない）
      properties:
        title:
          type: [string, 'null']
        author:
          type: [string, 'null']
        genre:
          type: [string, 'null']
        neta:
          type: [string, 'null']
        memo:
          type: [string, 'null']
        keywordA:
          type: [string, 'null']
        keywordB:
          type: [string, 'null']
        keywordC:
          type: [string, 'null']
        rating:
          type: [integer, 'null']
          minimum: 0
          maximum: 5
        unseen:
          type: [boolean, 'null']
        series:
          type: [string, 'null']
        volume:
          type: [number, 'null']
          format: double
        bookType:
          type: [integer, 'null']
        pageDirection:
          type: [string, 'null']
          description: '"rtl" | "ltr" | null（変更しない場合は省略）'
        clearSeries:
          type: boolean
          default: false
          description: true で series を NULL 化
        clearVolume:
          type: boolean
          default: false
          description: true で volume を NULL 化
        clearPageDirection:
          type: boolean
          default: false
          description: true で pageDirection を NULL 化（本ごと設定を消してライブラリ既定に戻す）

    StampDefinitionsDTO:
      type: object
      description: スタンプ定義マップ（dbColumn → 値配列）
      required: [definitions]
      properties:
        definitions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: |
            キーは DB カラム名（genre / neta / keyword_a / keyword_b / keyword_c）、
            値はスタンプ候補文字列の配列。

    StampApplyRequest:
      type: object
      description: 一括スタンプ適用リクエスト
      required: [field, bookIDs]
      properties:
        field:
          type: string
          description: 対象フィールド（genre / neta / keyword_a / keyword_b / keyword_c）
        value:
          type: [string, 'null']
          description: 適用する値（append モード）
        clear:
          type: [boolean, 'null']
          description: true でフィールドを空にクリア
        bookIDs:
          type: array
          items:
            type: integer
          description: 対象書籍 ID リスト

    StampApplyReply:
      type: object
      description: 一括スタンプ適用レスポンス
      required: [updated]
      properties:
        updated:
          type: integer
          description: 更新された書籍数

    CoverCandidatesDTO:
      type: object
      description: 表紙候補（アーカイブのページ名一覧）
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: string
          description: アーカイブ内の画像エントリ名一覧
        current:
          type: [string, 'null']
          description: 現在の coverImageName（未設定は null）

    CoverUpdateRequest:
      type: object
      description: 表紙更新リクエスト
      properties:
        coverImageName:
          type: [string, 'null']
          description: 設定する表紙エントリ名（null = 自動先頭ページ）
        setCoverImageName:
          type: boolean
          default: false
          description: true で coverImageName を更新＋サムネイル再生成
        coverCropRect:
          type: [string, 'null']
          description: クロップ矩形 JSON（null = クロップ解除）
        setCoverCropRect:
          type: boolean
          default: false
          description: true で coverCropRect を更新

    LabelSettingsDTO:
      type: object
      description: ラベルカスタマイズ設定（GET 応答・PUT リクエスト共用）
      required: [customFieldLabels, customBookTypeLabels]
      properties:
        customFieldLabels:
          type: object
          additionalProperties:
            type: string
          description: |
            キーは DB カラム名（genre / neta / keyword_a / keyword_b / keyword_c）、
            値はカスタムラベル文字列。空文字値は除外される。
        customBookTypeLabels:
          type: object
          additionalProperties:
            type: string
          description: |
            キーは bookType コード文字列（"0".."5"）、値はカスタムラベル。空文字値は除外される。

    AdjacentVolumeReply:
      type: object
      description: 隣接巻レスポンス（該当なしは book=null）
      required: [book]
      properties:
        book:
          oneOf:
            - $ref: '#/components/schemas/BookListItemDTO'
            - type: 'null'

    EPUBLocatorDTO:
      type: object
      description: EPUB の読書位置（POST /epub-progress・manifest と同じ形・G48-2）
      required: [spine, progress]
      properties:
        spine: { type: integer, description: spine index（0 始まり） }
        progress: { type: number, description: spine 内の進行率 0…1 }
        cfi: { type: [string, 'null'], description: 同じ engine のときだけ復元に使う補助 }
        engine: { type: [string, 'null'], description: cfi を出したエンジン名（washi / foliate） }

    ManifestDTO:
      type: object
      description: 書籍マニフェスト（ページ数・方向・形式・ETag）
      required: [pageCount, direction, format, etag]
      properties:
        pageCount:
          type: integer
        direction:
          type: string
          enum: [rtl, ltr]
          description: 実効ページ方向（null は返さない・ライブラリ既定を適用済み）
        format:
          type: string
          description: アーカイブ形式（archive / image / folder / video / text / epub）。`epub` はテキスト EPUB（G48-3）で、pageCount は 0・ページ経路は無い。全ページ画像の EPUB は text のままページ経路で配る
        etag:
          type: string
        pageOverrides:
          type: object
          additionalProperties:
            type: integer
            enum: [0, 1]
          description: ページごとの見開きの上書き（`POST …/page-layout` で書く・G17）。キーはページ番号（0 始まり）の文字列、値は 0＝見開きにする・1＝単ページにする。上書きが 1 つも無い本はキー省略
        damageNote:
          type: string
          description: 破損などで全ページを読めなかったときの注意文（G26）。全ページ読めたならキー省略
        epubLocator:
          description: format が epub のときの読書位置（未保存ならキー省略）。POST /epub-progress と同じ形
          allOf:
            - $ref: '#/components/schemas/EPUBLocatorDTO'
        pageNames:
          type: array
          items: { type: string }
          description: ページの名前（pages/{n} の番号の順。書庫は書庫の中のパス・フォルダはファイル名・画像 1 枚の本はそのファイル名）。`?pageNames=1` を付けた要求にだけ付ける。PDF・EPUB などページに名前の無い本と、古いサーバはキー省略

    AddBooksRequestDTO:
      type: object
      description: POST /books のリクエスト（サーバローカルの絶対パスを追加）
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
          description: 追加するファイルのサーバローカル絶対パス一覧
        presetID:
          type: [string, 'null']
          description: ファイル名フォーマットプリセット ID（省略時は既定フォーマット）

    AddBooksReplyDTO:
      type: object
      description: POST /books のレスポンス
      required: [addedIDs, alreadyPresent, failed]
      properties:
        addedIDs:
          type: array
          items:
            type: integer
          description: 新規追加された書籍 ID 一覧
        alreadyPresent:
          type: array
          items:
            type: string
          description: 既にライブラリに存在したファイルのパス
        failed:
          type: array
          items:
            type: string
          description: 追加に失敗したファイルのパス

    SessionReply:
      type: object
      description: セッションの鍵（`POST /session` の応答）
      required: [sessionToken, expiresIn]
      properties:
        sessionToken:
          type: string
          description: '`?token=` で渡す短命の鍵。ヘッダ（`Authorization: Bearer`）で出してもセッションとしては引かれない'
        expiresIn:
          type: integer
          description: 有効期間（秒・今は 1800）。使っても延びない。サーバの再起動でも失効する

    GrantDTO:
      type: object
      description: グラント 1 件（一覧・作成・更新の応答）。鍵そのもの（token）を含む
      required: [id, label, token, tier, scope]
      properties:
        id:
          type: string
          description: グラントの ID（秘密ではない）
        label:
          type: string
          description: 表示用の名前
        token:
          type: string
          description: '鍵そのもの（`Authorization: Bearer` で渡す）。admin だけが読める'
        tier:
          type: string
          enum: [read, edit, admin]
        scope:
          description: 鍵の範囲。全書庫は空のオブジェクト、決めた書庫だけなら libraries にその UUID の配列
          oneOf:
            - type: object
              maxProperties: 0
              description: 全書庫
            - type: object
              required: [libraries]
              properties:
                libraries:
                  type: array
                  items:
                    type: string

    GrantCreateRequest:
      type: object
      description: グラントの作成（POST /grants の本文）。鍵と ID はサーバが作る
      required: [label, tier, scope]
      properties:
        label:
          type: string
        tier:
          type: string
          enum: [read, edit, admin]
        scope:
          description: 全書庫は空のオブジェクト、決めた書庫だけなら libraries にその UUID の配列。呼び手の scope を超えたら 403
          oneOf:
            - type: object
              maxProperties: 0
              description: 全書庫
            - type: object
              required: [libraries]
              properties:
                libraries:
                  type: array
                  items:
                    type: string

    GrantUpdateRequest:
      type: object
      description: グラントの更新（PATCH /grants/{id} の本文）。省いた項目（null を含む）は変えない。鍵は変わらない
      properties:
        label:
          type: [string, 'null']
        tier:
          type: [string, 'null']
          enum: [read, edit, admin, null]
        scope:
          description: 全書庫は空のオブジェクト、決めた書庫だけなら libraries にその UUID の配列。呼び手の scope を超えたら 403
          oneOf:
            - type: object
              maxProperties: 0
              description: 全書庫
            - type: object
              required: [libraries]
              properties:
                libraries:
                  type: array
                  items:
                    type: string
            - type: 'null'

    SmartShelfConditions:
      type: object
      description: スマートシェルフの条件（条件の取得の応答・設定の本文と応答・作成と更新の本文の conditions で共通）
      required: [version, match, rules]
      properties:
        version:
          type: integer
          description: 条件の形式の版（今は 1）
        match:
          type: string
          enum: [all, any]
          description: all はすべてのルールに合う本、any はどれかのルールに合う本
        rules:
          type: array
          items:
            $ref: '#/components/schemas/SmartShelfRule'

    SmartShelfRule:
      type: object
      description: スマートシェルフのルール 1 件
      required: [id, field, op, value]
      properties:
        id:
          type: string
          format: uuid
        field:
          type: string
          enum: [title, author, genre, series, neta, keywordA, keywordB, keywordC, memo, bookType, rating, unseen, pages, dateAdded, playDate]
          description: 対象の項目。title〜memo は文字列、bookType・rating・pages は数、dateAdded・playDate は日付、unseen は未読
        op:
          type: string
          enum: [equals, contains, startsWith, endsWith, eq, gte, lte, within, olderThan, isUnread, isRead]
          description: 文字列は equals・contains・startsWith・endsWith、数は eq・gte・lte、日付は within・olderThan（日数）、未読は isUnread・isRead
        value:
          $ref: '#/components/schemas/RuleValue'

    RuleValue:
      type: object
      description: ルールの値。kind が値の型を決める
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [text, int, days]
        value:
          description: kind が text なら文字列、int なら整数、days なら日数（整数）
          oneOf:
            - type: string
            - type: integer

    ShelfCreateRequest:
      type: object
      description: シェルフの作成（POST /libraries/{lib}/shelves の本文）
      required: [title, isSmart]
      properties:
        title:
          type: string
        isSmart:
          type: boolean
          description: true でスマートシェルフ（conditions が要る。無ければ 400）。false で手動の棚（conditions を付けたら 409）
        conditions:
          oneOf:
            - $ref: '#/components/schemas/SmartShelfConditions'
            - type: 'null'

    ShelfUpdateRequest:
      type: object
      description: シェルフの更新（PATCH /libraries/{lib}/shelves/{id} の本文）。省いた項目は変えない
      properties:
        title:
          type: [string, 'null']
          description: 新しい名前。お気に入りの棚の名前は変えられない（409）
        conditions:
          description: 新しい条件。スマートシェルフでなければ 409
          oneOf:
            - $ref: '#/components/schemas/SmartShelfConditions'
            - type: 'null'

    ShelfBooksRequest:
      type: object
      description: 手動の棚の所属を足す・外す本文
      required: [bookIDs]
      properties:
        bookIDs:
          type: array
          items:
            type: integer
          description: 本の ID。足すときは既に所属している本を飛ばし、末尾に足す

    LockRequest:
      type: object
      description: 書庫の施錠・パスワードの変更（POST /libraries/{lib}/lock の本文）
      required: [password]
      properties:
        password:
          type: string
          description: 新しいパスワード（空なら 400）
        currentPassword:
          type: [string, 'null']
          description: 今のパスワード。既に施錠した書庫のパスワードを変えるときだけ要る（無い・違うときは 403）

    LockRemoveRequest:
      type: object
      description: 書庫の施錠の解除（DELETE /libraries/{lib}/lock の本文）。施錠していない書庫では本文ごと省いてよい
      properties:
        currentPassword:
          type: [string, 'null']
          description: 今のパスワード。施錠した書庫では要る（無い・違うときは 403）

    LibraryCountsDTO:
      type: object
      description: サイドバーの件数（一覧の絞り込みに依らない）
      required: [libraryTotal, recentCount, recentDays]
      properties:
        libraryTotal:
          type: integer
          description: 書庫の全冊数
        recentCount:
          type: integer
          description: 最近 recentDays 日に足した冊数
        recentDays:
          type: integer
          description: 「最近」の日数（書庫の設定・既定 14）

    PageLayoutRequestBody:
      type: object
      description: ページごとの見開きの上書き（POST /libraries/{lib}/books/{id}/page-layout の本文）
      required: [page]
      properties:
        page:
          type: integer
          minimum: 0
          description: ページ番号（0 始まり）。ページ数以上は 400
        mode:
          type: [integer, 'null']
          enum: [0, 1, null]
          description: 0＝見開きにする・1＝単ページにする。省くか null で上書きを消す（自動の判定に戻す）。ほかの値は 400

    FullScanStartRequest:
      type: object
      description: 整合性のフルスキャンの開始（POST /libraries/{lib}/integrity/full-scan の本文）
      required: [mode]
      properties:
        mode:
          type: string
          enum: [unchecked, all, damaged]
          description: unchecked はフルスキャンをまだしていない本（中断からの再開）、all はすべての本、damaged は前回 damaged だった本。ほかの値は 400

    DuplicateScanReply:
      type: object
      description: 重複の検査の結果
      required: [exact, possible, candidateCount, hashedCount, missingCount]
      properties:
        exact:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateGroupDTO'
          description: 中身（SHA-256）が同じ本の組
        possible:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateGroupDTO'
          description: シリーズと巻が同じ本の組（全員が 1 つの exact の組に入るものは除く）
        candidateCount:
          type: integer
          description: 調べた本の数（ファイルがあるもの。フォルダは除く）
        hashedCount:
          type: integer
          description: 今回ハッシュを計算した本の数（同じ大きさのファイルが他にあり、保存したハッシュが古いか無いもの）
        missingCount:
          type: integer
          description: ファイルが見つからなかった本の数

    DuplicateGroupDTO:
      type: object
      description: 重複の組 1 つ
      required: [kind, key, members]
      properties:
        kind:
          type: string
          enum: [exact, possibleSeriesVolume]
        key:
          type: string
          description: 組の鍵（exact はハッシュ、possibleSeriesVolume はシリーズと巻から作る）
        members:
          type: array
          items:
            $ref: '#/components/schemas/BookListItemDTO'

    IntegritySummaryReply:
      type: object
      description: 整合性の検査の集計（G27a）
      required: [checked, unchecked, damaged, degraded]
      properties:
        checked:
          type: integer
          description: 検査の記録がある本の数
        unchecked:
          type: integer
          description: まだ検査の記録が無い本の数
        damaged:
          type: integer
          description: 壊れている（damaged）本の数
        degraded:
          type: integer
          description: 前回は ok で今回 damaged になった（ディスクの上で劣化した疑いのある）本の数
        lastScanAt:
          type: [integer, 'null']
          format: int64
          description: 最後に検査した時刻（epoch 秒）。今のサーバは常にキーを送り、1 冊も検査していなければ null。古いサーバはキーを送らない（「未検査」と「分からない」を区別するため）
        unsupported:
          type: integer
          description: 検査の対象外（フォルダ・動画・テキスト・電子書籍、StackNest が読めない形式）の本の数（G64）。今のサーバは常に送る。古いサーバはキーを送らないので、無いときは 0 冊ではなく「分からない」

    IntegrityListReply:
      type: object
      description: 整合性の記録の一覧
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrityItemDTO'

    IntegrityItemDTO:
      type: object
      description: 本 1 冊の整合性の記録
      required: [bookID, title, status, checkedAt, badEntries, degraded]
      properties:
        bookID:
          type: integer
        title:
          type: string
        filename:
          type: string
          description: ファイル名だけ（パスは伏せる）。パスの無い本はキー省略
        status:
          type: string
          enum: [ok, damaged, empty, missing, unsupported]
          description: ok は全部読めた、damaged は CRC の不一致・途中で壊れている、empty は画像が 1 枚も無い、missing はファイルが無い、unsupported は検査の対象外
        checkedAt:
          type: integer
          format: int64
          description: 検査した時刻（epoch 秒）
        entryCount:
          type: integer
          description: 読めた中身の数。分からなければキー省略
        badEntries:
          type: array
          items:
            type: string
          description: 読めなかった中身の名前
        degraded:
          type: boolean
          description: 前回 ok で今回 damaged か

    IntegrityScanReply:
      type: object
      description: 簡易の整合性の検査の結果。ok＋damaged＋empty＋missing＋unsupported＋persistenceFailures＝scanned
      required: [scanned, ok, damaged, empty, missing, unsupported, pagesUpdated, persistenceFailures]
      properties:
        scanned:
          type: integer
          description: 調べた本の数
        ok:
          type: integer
        damaged:
          type: integer
        empty:
          type: integer
        missing:
          type: integer
        unsupported:
          type: integer
        pagesUpdated:
          type: integer
          description: ページ数を書き込んだ本の数
        persistenceFailures:
          type: integer
          description: 結果を DB に書けなかった本の数

    IntegrityCheckDTO:
      type: object
      description: SQLite の integrity_check の結果
      required: [healthy, rows]
      properties:
        healthy:
          type: boolean
          description: rows がちょうど ["ok"] のとき true
        rows:
          type: array
          items:
            type: string
          description: integrity_check が返した行。検査そのものが失敗したら ["(error)"]（訳さない値）

    MaintenanceStatusReply:
      type: object
      description: 保守のジョブの進み。走っていなければ running だけ（ほかのキーは省く）
      required: [running]
      properties:
        running:
          type: boolean
        job:
          type: string
          enum: [complete-metadata, compress-covers, full-scan]
        done:
          type: integer
        total:
          type: integer
        startedAt:
          type: integer
          format: int64
          description: 始めた時刻（epoch 秒）

    WatchConfigDTO:
      type: object
      description: 監視フォルダの設定（GET の応答・PUT の本文と応答）
      required: [enabled, folders]
      properties:
        enabled:
          type: boolean
          description: 監視フォルダ全体の ON・OFF
        folders:
          type: array
          items:
            $ref: '#/components/schemas/WatchedFolderDTO'
        presets:
          type: array
          items:
            $ref: '#/components/schemas/FilenameFormatPresetDTO'
          description: 応答だけ。書庫のファイル名の書式のプリセット（id と name だけ。format は省く）。PUT の本文では読まない

    WatchedFolderDTO:
      type: object
      description: 監視フォルダ 1 件。応答では baseline と subfolderMode を常に含む
      required: [id, path, enabled]
      properties:
        id:
          type: string
        path:
          type: string
          description: サーバの上のフォルダの絶対パス
        enabled:
          type: boolean
        presetID:
          type: [string, 'null']
          description: 取り込みに使うファイル名の書式のプリセット
        baseline:
          type: array
          items:
            type: string
          description: 足した時点で既にあったファイルのパス（取り込まない）。サーバが持つ値で、PUT の本文の値は使わない
        subfolderMode:
          type: string
          enum: [topLevelOnly, archive, recurse]
          default: topLevelOnly
          description: サブフォルダの扱い（topLevelOnly は直下だけ、archive はサブフォルダを 1 冊として、recurse は中まで）

    FilenameFormatPresetDTO:
      type: object
      description: ファイル名の書式のプリセット 1 件
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        format:
          type: [string, 'null']
          description: 書式（例 `@title`）。監視フォルダの設定の応答では省く。プリセットの設定（PUT）では空なら 400

    ImportExistingRequest:
      type: object
      description: 監視フォルダの既にあるファイルの取り込み（POST /libraries/{lib}/watch/import-existing の本文）
      required: [folderID]
      properties:
        folderID:
          type: string
          description: 監視フォルダの id

    ImportConfigDTO:
      type: object
      description: 書庫ごとの取り込みの設定。キーが無い（null）項目は全体の既定（GET /import-config）に従う
      properties:
        autoClassifyEnabled:
          type: [boolean, 'null']
          description: 取り込みのときに種類を自動で分けるか
        thickBookThreshold:
          type: [integer, 'null']
          description: 厚い本とみなすページ数（保存するときに 5〜100 に収める）
        preferEPUBTitle:
          type: [boolean, 'null']
          description: EPUB に題名があればそれを使うか（G54-S4）

    GlobalImportConfigDTO:
      type: object
      description: 取り込みの全体の既定（書庫に属さない）。応答では 3 項目を常に含む
      required: [autoClassifyEnabled, thickBookThreshold]
      properties:
        autoClassifyEnabled:
          type: boolean
        thickBookThreshold:
          type: integer
          description: 厚い本とみなすページ数（5〜100 に収める）
        preferEPUBTitle:
          type: boolean
          description: EPUB に題名があればそれを使うか。PUT の本文で省くと false として保存する

    GeneralSettingsDTO:
      type: object
      description: 書庫の一般の設定
      required: [displayName, backupEnabled, backupGenerations]
      properties:
        displayName:
          type: string
          description: 書庫の表示名。空ならバンドルの名前を使う
        backupEnabled:
          type: boolean
          description: 自動バックアップをするか（未設定なら true）
        backupGenerations:
          type: integer
          description: 残すバックアップの世代数（未設定なら 5）。範囲の外の値も 400 にはせず、保存するときに 1〜20 に収める（応答は収めた後の値）

    PresetSetDTO:
      type: object
      description: ファイル名の書式のプリセットの集まりと既定の id
      required: [presets, defaultID]
      properties:
        presets:
          type: array
          items:
            $ref: '#/components/schemas/FilenameFormatPresetDTO'
        defaultID:
          type: string
          description: 既定のプリセットの id（presets に無い id なら、サーバが presets の中の id に直す）

    RelinkRequest:
      type: object
      description: 本のファイルの付け直し（POST /libraries/{lib}/books/{id}/relink の本文）
      required: [newPath]
      properties:
        newPath:
          type: string
          description: 新しいファイルのサーバの上の絶対パス。空なら 400、許したルートの外なら 403

    RestoreResultDTO:
      type: object
      description: 削除の取り消し（POST /libraries/{lib}/books/restore）の結果
      required: [restored, requested, restoredIDs]
      properties:
        restored:
          type: integer
          description: 戻した冊数
        requested:
          type: integer
          description: 本文にあった冊数
        restoredIDs:
          type: array
          items:
            type: integer
          description: 戻した本の ID（ID が他の本に使われていて戻せなかった本は含まない）。やり直し（再削除）はこの ID だけを対象にする

    OpenLibraryRequest:
      type: object
      description: 書庫を開く（POST /local/libraries/open の本文）
      required: [path]
      properties:
        path:
          type: string
          description: 書庫のバンドルのローカルの絶対パス

    OpenLibraryReply:
      type: object
      description: 開いた（既に開いていた）書庫
      required: [uuid]
      properties:
        uuid:
          type: string
          description: ライブラリ UUID

    CloseLibraryRequest:
      type: object
      description: 書庫を閉じる（POST /local/libraries/close の本文）
      required: [uuid]
      properties:
        uuid:
          type: string
          description: ライブラリ UUID

    FinderTagSyncStatusReply:
      type: object
      description: Finder タグの同期の状態（動いているアプリが持つ値そのもの）
      required: [running, locked]
      properties:
        field:
          type: string
          description: 同期する項目の列名（genre・author・neta・keyword_a・keyword_b・keyword_c）。同期しないならキー省略
        running:
          type: boolean
          description: 今この書庫の同期が走っているか
        locked:
          type: boolean
          description: アプリでこの書庫が施錠中（解錠していない）か。true なら再照合は断られる

    FinderTagSyncFieldRequest:
      type: object
      description: Finder タグの同期する項目の変更（PUT /local/libraries/{uuid}/finder-tags の本文）
      properties:
        field:
          type: [string, 'null']
          description: 同期する項目の列名（genre・author・neta・keyword_a・keyword_b・keyword_c）。null・空なら同期をやめる。ほかの名前は 400

    FinderTagResyncReply:
      type: object
      description: Finder タグの再照合の結果。status が started 以外なら件数はすべて 0（走っていない）
      required: [status, updatedInLibrary, updatedInFinder, skippedTags, skippedBooks, indexingDisabledVolumes]
      properties:
        status:
          type: string
          enum: [started, alreadyRunning, noLibrary, noField, locked]
          description: 始まったか、始まらなかったならなぜか（started は終わるまで走った）
        field:
          type: string
          description: 同期する項目の列名（分かれば。断られたときも入る）
        updatedInLibrary:
          type: integer
          description: Finder のタグから書庫の項目を書き換えた本の数
        updatedInFinder:
          type: integer
          description: 書庫の項目から Finder のタグを書き換えた本の数
        skippedTags:
          type: array
          items:
            type: string
          description: 区切り（`, `）を含むので同期しなかったタグの名前
        skippedBooks:
          type: array
          items:
            type: string
          description: タグを読めなかった本のパス
        indexingDisabledVolumes:
          type: array
          items:
            type: string
          description: Spotlight の索引が無効なボリュームの名前。空でなければ Finder から書庫への向きは動いていない
        failure:
          type: string
          description: 同期そのものが失敗した理由（表示用）。失敗していなければキー省略

    RenameFilesRequest:
      type: object
      description: メタデータでのファイル名の変更（POST /local/libraries/{uuid}/rename-files の本文）
      required: [ids, apply]
      properties:
        ids:
          type: array
          items:
            type: integer
          description: 本の ID
        presetID:
          type: [string, 'null']
          description: 使うファイル名の書式のプリセット（format と両方は 400。どちらも無ければ書庫の既定のプリセット）
        format:
          type: [string, 'null']
          description: 使う書式そのもの（presetID と両方は 400）
        apply:
          type: boolean
          description: true のときだけファイルを動かす。false なら計画を返すだけ。キーを省くと 400

    RenamePlanRowDTO:
      type: object
      description: ファイル名の変更の 1 冊分
      required: [id, oldName, newName, status]
      properties:
        id:
          type: integer
        oldName:
          type: string
        newName:
          type: string
        status:
          type: string
          enum: [ok, unchanged, conflictExisting, conflictInBatch, emptyName, tooLong, noPath]
          description: ok は変えられる、unchanged は同じ名前、conflictExisting は同じ名前のファイルが既にある、conflictInBatch は今回の中で名前がぶつかる、emptyName は名前が空になる、tooLong は長すぎる、noPath はファイルが無い
        failure:
          type: string
          description: 実行して失敗したときの理由。計画だけならキー省略

    RenameFilesReply:
      type: object
      description: ファイル名の変更の結果。status が ok 以外なら rows は空で applied は false
      required: [status, applied, rows, missingIDs, renamed, skipped]
      properties:
        status:
          type: string
          enum: [ok, badFormat, failed]
          description: ok は計画（または実行）できた、badFormat は書式の誤り、failed は DB・ディスクの障害（理由は failure）
        applied:
          type: boolean
          description: 実際にファイルを動かしたか
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RenamePlanRowDTO'
        missingIDs:
          type: array
          items:
            type: integer
          description: 書庫に無い本の ID（rows には入れない）
        renamed:
          type: integer
          description: 名前を変えた数（applied が false なら 0）
        skipped:
          type: integer
          description: 変えなかった数（ok 以外の行と、実行して失敗した行）
        failure:
          type: string
          description: status が failed のときだけ入る理由（表示用）

paths:
  /server/info:
    get:
      summary: サーバ情報・機能取得（認証不要）
      description: |
        ペアリング前の到達性確認用。認証なしでアクセス可能。
        サーバのバージョン・対応フォーマット・トランスコード可否を返す。
      security: []
      tags: [Server]
      operationId: getServerInfo
      x-stacknest-tier: none
      responses:
        '200':
          description: サーバ機能情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerCapabilities'

  /me:
    get:
      summary: 鍵の tier と scope の確認
      description: 提示した鍵の tier・互換の role・scope を返す。編集の前に権限を確かめるのに使う。
      tags: [Auth]
      operationId: getMe
      x-stacknest-tier: read
      responses:
        '200':
          description: 鍵の tier・互換の role・scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeReply'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /session:
    post:
      summary: セッションの鍵への引き換え
      description: |
        ヘッダ `Authorization: Bearer` で出した鍵（グラント・固定の鍵）を、30 分だけ効くセッションの鍵に引き換える。
        セッションの鍵は `?token=` で渡したときだけ効き、元の鍵と同じ tier と scope を持つ（使うたびに元の鍵で照らし直すので、元のグラントを消すと効かなくなる）。
        ヘッダを付けられない EventSource（`GET /events`）や `<img>` のために、永続の鍵を URL・履歴・ログに残さないで済ませる。
        `?token=` だけで呼んだら 401（クエリでの発行は受け付けない）。
      tags: [Auth]
      operationId: createSession
      x-stacknest-tier: read
      responses:
        '200':
          description: 発行したセッションの鍵
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionReply'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /grants:
    get:
      summary: グラントの一覧（admin）
      description: |
        グラントの一覧を返す。各要素は鍵そのもの（`token`）を含む。
        呼び手の scope に含まれるグラントだけを返す（全書庫の admin はすべて。書庫を限った admin には、その書庫の中に収まるグラントだけで、全書庫のグラントは返さない）。
        **admin の tier が必要。**
      tags: [Grants]
      operationId: listGrants
      x-stacknest-tier: admin
      responses:
        '200':
          description: グラントの一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrantDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: グラントの作成（admin）
      description: |
        グラントを作り、新しい鍵と ID を返す。すぐに認証に使える。
        呼び手の権限を超える scope（書庫を限った admin が全書庫や scope の外の書庫を指定する）・tier は 403。
        **admin の tier が必要。**
      tags: [Grants]
      operationId: createGrant
      x-stacknest-tier: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCreateRequest'
      responses:
        '200':
          description: 作ったグラント（鍵そのものを含む）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantDTO'
        '400':
          description: 本文が読めない
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /grants/{id}:
    patch:
      summary: グラントの更新（admin）
      description: |
        グラントの名前・tier・scope を変える（鍵は変わらない）。次の要求からすぐに効く。
        呼び手の scope の外にあるグラントは、在るか無いかを漏らさないため 404。更新後の scope・tier が呼び手の権限を超えるなら 403。
        `GET /events` の接続は、scope を変えると次の心拍で閉じる（tier だけの変更では閉じない）。
        **admin の tier が必要。**
      tags: [Grants]
      operationId: updateGrant
      x-stacknest-tier: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: グラントの ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantUpdateRequest'
      responses:
        '200':
          description: 更新後のグラント（鍵そのものを含む）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantDTO'
        '400':
          description: 本文が読めない
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: グラントの削除（admin）
      description: |
        グラントを消す。その鍵・その鍵で得たセッションの鍵は次の要求から 401 になり、そのグラントで発行した本専用の鍵も 401 になる。
        `GET /events` の接続は次の心拍（約 5 秒）で閉じる。
        呼び手の scope の外にあるグラントは 404。
        **admin の tier が必要。**
      tags: [Grants]
      operationId: deleteGrant
      x-stacknest-tier: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: グラントの ID
      responses:
        '204':
          description: 消した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries:
    get:
      summary: 配信中ライブラリ一覧
      description: サーバが配信しているライブラリの一覧を返す。ロック庫も含む（locked=true）。施錠は書庫の DB から読み、読めなければ locked=true にする。
      tags: [Libraries]
      operationId: listLibraries
      x-stacknest-tier: read
      x-stacknest-lock: none
      responses:
        '200':
          description: ライブラリ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /libraries/{lib}/unlock:
    post:
      summary: ロック庫の解錠（ライブラリトークン取得）
      description: |
        パスワードを送信してロック庫を解錠し、短命なライブラリトークンを取得する。
        取得したトークンをヘッダ `X-Library-Token`、またはクエリ `?lt=<token>` で渡すと（ヘッダが優先）、ロック庫の API にアクセスできる。
        トークンの有効期間は発行から 24 時間で、使っても延びない。
        サーバの再起動、またはその書庫のパスワードの変更・解除でも失効する（securitySchemes の `libraryToken` と同じ）。
        施錠の状態を書庫の DB から読めない（書庫を閉じた直後）ときは、パスワードを照らさずに 503 を返す（失敗の回数にも数えない）。
      tags: [Libraries]
      operationId: unlockLibrary
      x-stacknest-tier: read
      x-stacknest-lock: none
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: 解錠成功・ライブラリトークン発行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockReply'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パスワード不正
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: 失敗が続いたため一定時間拒否（ブルートフォース抑止）。待つ秒数をヘッダ `Retry-After` で返す
          headers:
            Retry-After:
              description: 再試行までの秒数
              schema:
                type: string
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /libraries/{lib}/lock:
    post:
      summary: 書庫の施錠・パスワードの変更（admin）
      description: |
        書庫にパスワードを設定する（施錠）。既に施錠した書庫では、パスワードを変える。
        変えるときは、書庫の鍵（`X-Library-Token`）に加えて今のパスワード（`currentPassword`）が要り、無い・違うなら 403（施錠による 403 ではないので `X-Library-Locked` は付かない）。
        パスワードを変えると、それまでに出した書庫の鍵は使えなくなる。施錠・変更の前に発行した本専用の鍵は、その本を読めなくなる（403）。同時に別の変更が先に入ったら 409（何も変えない）。
        `settingsChanged` イベントを出す。**admin の tier が必要。**
      tags: [Libraries]
      operationId: setLibraryLock
      x-stacknest-tier: admin
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockRequest'
      responses:
        '204':
          description: 施錠した・パスワードを変えた
        '400':
          description: 本文が読めない・新しいパスワードが空
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 照らしたパスワード（または未施錠という前提）が、同時に入った別の変更で古くなった
        '503':
          $ref: '#/components/responses/LibraryUnavailable'
    delete:
      summary: 書庫の施錠の解除（admin）
      description: |
        書庫のパスワードを消す。施錠した書庫では、書庫の鍵（`X-Library-Token`）に加えて本文の今のパスワード（`currentPassword`）が要り、無い・違うなら 403（`X-Library-Locked` は付かない）。
        施錠していない書庫では、本文を読まずに 204（消すものは無いが、`settingsChanged` イベントは出る）。解除すると、それまでに出した書庫の鍵は使えなくなる。同時に別の変更が先に入ったら 409。
        `settingsChanged` イベントを出す。**admin の tier が必要。**
      tags: [Libraries]
      operationId: clearLibraryLock
      x-stacknest-tier: admin
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockRemoveRequest'
      responses:
        '204':
          description: 解除した（施錠していなければ何もしない）
        '400':
          description: 本文が空でなく、JSON として読めない
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 照らしたパスワードが、同時に入った別の変更で古くなった
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /libraries/{lib}/counts:
    get:
      summary: サイドバーの件数
      description: |
        書庫の全冊数と、最近足した冊数を返す（リモートのサイドバー用）。一覧の絞り込み（scope・filter）には依らない。
        「最近」の日数は書庫の設定（既定 14 日）。
      tags: [Libraries]
      operationId: getLibraryCounts
      x-stacknest-tier: read
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      responses:
        '200':
          description: サイドバーの件数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryCountsDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LibraryLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /libraries/{lib}/books:
    parameters:
      - name: lib
        in: path
        required: true
        schema:
          type: string
        description: ライブラリ UUID
    get:
      summary: 書籍一覧（ページング・検索・ソート・フィルタ）
      description: |
        ライブラリの書籍一覧をページング形式で返す。
        施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
      tags: [Books]
      operationId: listBooks
      x-stacknest-tier: read
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: 全文検索クエリ
        - name: sort
          in: query
          schema:
            type: string
            default: title
          description: ソートキー（title / author / dateAdded / playDate / rating / pages など）
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: ソート順（省略時はソートキーの既定順）
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
        - name: scope
          in: query
          schema:
            type: string
            enum: [library, favorites, recent, shelf, smartShelf]
          description: サイドバースコープ（省略時は library 全体）
        - name: scopeId
          in: query
          schema:
            type: integer
            format: int64
          description: scope=favorites/shelf/smartShelf 時のプレイリスト ID
        - name: recentDays
          in: query
          schema:
            type: integer
          description: scope=recent 時の対象日数（既定 7）
        - name: filter
          in: query
          schema:
            type: string
          description: URL エンコードされた FilterState JSON（不正値はフォールバック）
        - name: browse
          in: query
          schema:
            type: string
          description: |
            URL エンコードされた BrowseConstraint 配列 JSON。
            形式: `[{"column":"genre","value":"アクション"}]`
            列名は許可リスト外は 400。
        - name: fields
          in: query
          schema:
            type: string
          description: |
            カンマ区切りの追加フィールド名（genre / neta / keywordA / keywordB / keywordC / memo）。
            指定フィールドのみ応答に含まれる。
      responses:
        '200':
          description: 書籍一覧（ページング）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPageDTO'
        '400':
          description: 不正なクエリパラメータ（不正ソートキー・不正 browse 列名など）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LibraryLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LibraryUnavailable'
    post:
      summary: 書籍を追加（サーバローカルパス・in-place・admin 必須）
      description: |
        サーバローカルの絶対パスのファイルをライブラリに追加する（in-place。コピーはしない）。
        **admin の tier が必要。** 施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
        1 冊でも追加したら `structureChanged` イベントを出す。
      tags: [Books]
      operationId: addBooks
      x-stacknest-tier: admin
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBooksRequestDTO'
      responses:
        '200':
          description: 追加結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddBooksReplyDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /libraries/{lib}/shelves:
    get:
      summary: 棚一覧（ユーザー棚・スマート棚）
      description: |
