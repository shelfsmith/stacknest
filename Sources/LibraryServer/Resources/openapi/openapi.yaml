      description: |
        シリーズ・巻が空の本に、題名・ファイル名から推した値を入れる保守のジョブを始め、すぐに 202 を返す（空欄だけを埋め、書き込む直前に読み直すので他の編集を上書きしない）。
        書庫で別の保守のジョブが走っていれば 409。進みは `GET …/maintenance/status` と SSE の `maintenanceProgress`、終わりは `maintenanceFinished`（続けて `structureChanged`）。中断は `POST …/maintenance/cancel`。
        **admin の tier が必要。** 施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
      tags: [Maintenance]
      operationId: startCompleteMetadata
      x-stacknest-tier: admin
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      responses:
        '202':
          description: ジョブを始めた
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: この書庫で別の保守のジョブが走っている
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

