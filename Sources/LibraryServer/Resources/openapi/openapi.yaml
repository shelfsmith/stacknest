  /libraries/{lib}/integrity/full-scan:
    post:
      summary: 整合性のフルスキャンのジョブを始める（admin）
      description: |
        本の中身を全部読んで CRC を確かめる保守のジョブ（full-scan）を始め、すぐに 202 を返す。大きな書庫では何十時間もかかる。
        対象は `mode` で選ぶ（知らない値は 400）。結果は整合性の記録に書き、`integrity/summary`・`integrity/list` で読む。
        書庫で別の保守のジョブが走っていれば 409。進みは `GET …/maintenance/status` と SSE、中断は `POST …/maintenance/cancel`。
        **admin の tier が必要。** 施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
      tags: [Integrity]
      operationId: startFullIntegrityScan
      x-stacknest-tier: admin
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FullScanStartRequest'
      responses:
        '202':
          description: ジョブを始めた
        '400':
          description: 本文が読めない・mode が unchecked・all・damaged のどれでもない
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: この書庫で別の保守のジョブが走っている
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /libraries/{lib}/duplicates/scan:
    post:
      summary: 重複の検査（edit 以上）
      description: |
        書庫の本のファイルを調べ、中身が同じ組（exact）とシリーズ・巻が同じ組（possible）を返す。終わるまで待って返す。
        同じ大きさのファイルが他にある本だけハッシュ（SHA-256）を計算し、本の行に保存する（大きさ・更新時刻が変わっていなければ保存した値を使う）。
        **edit 以上の tier が必要。** 施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
      tags: [Integrity]
      operationId: scanDuplicates
      x-stacknest-tier: edit
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      responses:
        '200':
          description: 重複の検査の結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateScanReply'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /libraries/{lib}/integrity/summary:
    get:
      summary: 整合性の検査の集計
      description: |
        保存した整合性の記録を数えて返す（検査はしない）。最後に検査した時刻と、検査の対象外の冊数も返す。
        施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
      tags: [Integrity]
      operationId: getIntegritySummary
      x-stacknest-tier: read
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      responses:
        '200':
          description: 整合性の検査の集計
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegritySummaryReply'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LibraryLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /libraries/{lib}/integrity/list:
    get:
      summary: 整合性の記録の一覧
      description: |
        指定した状態（既定は damaged）の本の整合性の記録を題名の順に返す（検査はしない）。
        read の鍵でも読めるので、パスはファイル名だけに伏せて返す（フォルダの構成を漏らさない）。
        施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
      tags: [Integrity]
      operationId: listIntegrityRecords
      x-stacknest-tier: read
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
        - name: status
          in: query
          schema:
            type: string
            enum: [ok, damaged, empty, missing, unsupported]
            default: damaged
          description: 状態（ほかの値は 400）
      responses:
        '200':
          description: 整合性の記録の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityListReply'
        '400':
          description: status が知らない値
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LibraryLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /libraries/{lib}/integrity/scan:
    post:
      summary: 簡易の整合性の検査（edit 以上）
      description: |
        ページ数が分からない（null・0）本だけを開いて分類し（ok・damaged・empty・missing・unsupported）、結果とページ数を保存する。本文は読まない（本を選べない）。終わるまで待って返す。
        1 冊ずつ保存し、壊れた本があっても続ける。1 冊でも保存できたら `structureChanged` イベントを出す。
        **edit 以上の tier が必要。** 施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
      tags: [Integrity]
      operationId: scanIntegrity
      x-stacknest-tier: edit
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      responses:
        '200':
          description: 検査の結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityScanReply'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /events:
    get:
      summary: ライブ同期のイベント（SSE）
      description: |
        書庫の変化を Server-Sent Events（`text/event-stream`）で流し続ける。鍵の scope の外の書庫のイベントは流さない。この口が配信していない書庫（共有サーバでは共有を切った・共有していない・閉じた書庫）のイベントも、scope にかかわらず流さない。
        EventSource はヘッダを付けられないので、`POST /session` で得たセッションの鍵を `?token=` で渡す。
        約 5 秒ごとに心拍（`: ping` のコメント行）を送る。グラントのモードでは心拍ごとにグラントを確かめ直し、グラントが消えた・scope が変わったら流れを閉じる（tier だけの変更では閉じない。消えたグラントで繋ぎ直すと 401）。
        施錠を見ない（書庫の鍵は要らない）。施錠中の書庫の `bookChanged` は、本の ID から蔵書数の目安が漏れないよう `bookId` を落とした `structureChanged` に丸める。施錠は書庫の DB から読み、読めなければ施錠中として丸める。
        イベントの名前（`event:`）と `data:` の JSON:
        - `bookChanged` `{"library": "<UUID>", "bookId": 1}`: 本のメタデータ・表紙・評価・未読・方向・見開きの上書きなどが変わった
        - `structureChanged` `{"library": "<UUID>"}`: 本の追加・削除・復元・再リンク、棚の所属、整合性の検査、保守のジョブの終わりなどで一覧が変わった
        - `settingsChanged` `{"library": "<UUID>"}`: 書庫の設定（ラベル・スタンプ・シェルフ・監視フォルダ・取り込み・一般の設定・プリセット・施錠）が変わった
        - `maintenanceProgress` `{"library": "<UUID>", "job": "full-scan", "done": 10, "total": 100}`: 保守のジョブ（complete-metadata・compress-covers・full-scan）の進み
        - `maintenanceFinished` `{"library": "<UUID>", "job": "full-scan", "outcome": "done", "count": 100}`: 保守のジョブの終わり（outcome は done・cancelled・failed）
        読書位置の書き込み（progress・epub-progress）はイベントを出さない。
      tags: [Events]
      operationId: streamEvents
      x-stacknest-tier: read
      x-stacknest-lock: none
      responses:
        '200':
          description: イベントの流れ（`Cache-Control` は no-cache）。切断するまで終わらない
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE のフレーム（`event:` の行・`data:` の行・空行）と心拍のコメント行
        '401':
          $ref: '#/components/responses/Unauthorized'

  /local/libraries/open:
    servers:
      - url: /
    post:
      summary: パスで書庫を開く（ローカル・admin）
      description: |
        127.0.0.1 の口で「ローカルコントロールを許可」が ON のときだけある（共有サーバ・読書位置の同期だけの口には無く 404）。
        ローカルの絶対パスの書庫をアプリで開き（既に開いていればそのまま）、その UUID を返す。開くのはアプリの窓と同じ経路。
        パスが無い・書庫でなければ 400、開いた書庫の読み込みを待てなかった・アプリの起動が終わっていないなら 500、開く仕組みの無い口では 501。
        施錠は見ない。**admin の tier が必要**（127.0.0.1 の口では CLI の鍵が admin）。本専用の鍵は通らない。
      tags: [Local]
      operationId: openLocalLibrary
      x-stacknest-tier: admin
      x-stacknest-lock: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenLibraryRequest'
      responses:
        '200':
          description: 開いた（既に開いていた）書庫
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenLibraryReply'
        '400':
          description: 本文が読めない・パスが無い・書庫として正しくない
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 開く仕組みが書庫を見つけられないと答えた（今のアプリは返さない）
        '500':
          description: 書庫の読み込みを待てなかった・アプリの起動が終わっていない
        '501':
          description: この口には書庫を開く仕組みが無い

  /local/libraries/close:
    servers:
      - url: /
    post:
      summary: 書庫を閉じる（ローカル・admin）
      description: |
        127.0.0.1 の口で「ローカルコントロールを許可」が ON のときだけある（共有サーバ・読書位置の同期だけの口には無く 404）。
        UUID で指した書庫の窓をアプリで閉じる。アプリで開いていなければ 404、閉じたことを確かめられなければ 500、閉じる仕組みの無い口では 501。
        閉じる仕組みが「アプリの起動が終わっていない」と答えたときは、開くとき（500）と違って 400（今のアプリは閉じるときにこれを返さない）。
        施錠は見ない。**admin の tier が必要**（127.0.0.1 の口では CLI の鍵が admin）。本専用の鍵は通らない。
      tags: [Local]
      operationId: closeLocalLibrary
      x-stacknest-tier: admin
      x-stacknest-lock: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseLibraryRequest'
      responses:
        '204':
          description: 閉じた
        '400':
          description: 本文が読めない・アプリの起動が終わっていない
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: その書庫をアプリで開いていない
        '500':
          description: 閉じたことを確かめられなかった
        '501':
          description: この口には書庫を閉じる仕組みが無い

  /local/libraries/{uuid}/finder-tags:
    servers:
      - url: /
    get:
      summary: Finder タグの同期の状態（ローカル・admin）
      description: |
        127.0.0.1 の口で「ローカルコントロールを許可」が ON のときだけある（共有サーバ・読書位置の同期だけの口には無く 404）。
        動いているアプリが持つ、その書庫の Finder タグの同期の状態（同期する項目・走っているか・施錠中か）を返す。アプリで開いていない書庫は 404。
        サーバの側では施錠を見ない（書庫の鍵は要らない。施錠中かは応答の `locked` で分かる）。**admin の tier が必要。**
      tags: [Local]
      operationId: getFinderTagSync
      x-stacknest-tier: admin
      x-stacknest-lock: none
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      responses:
        '200':
          description: Finder タグの同期の状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinderTagSyncStatusReply'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: この口には Finder タグの同期の仕組みが無い
    put:
      summary: Finder タグの同期する項目の変更（ローカル・admin）
      description: |
        127.0.0.1 の口で「ローカルコントロールを許可」が ON のときだけある（共有サーバ・読書位置の同期だけの口には無く 404）。
        Finder タグと同期する書庫の項目を変える（null・空で同期をやめる）。知らない列名は 400（黙って同期をやめない）。項目を変えると前回の同期の値は消える。
        走っている同期が止まってから変え、変えた後の状態を返す。アプリで開いていない書庫は 404。
        サーバの側では施錠を見ない（書庫の鍵は要らない）。**admin の tier が必要。**
      tags: [Local]
      operationId: setFinderTagSyncField
      x-stacknest-tier: admin
      x-stacknest-lock: none
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinderTagSyncFieldRequest'
      responses:
        '200':
          description: 変えた後の Finder タグの同期の状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinderTagSyncStatusReply'
        '400':
          description: 本文が読めない・知らない列名
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: この口には Finder タグの同期の仕組みが無い

  /local/libraries/{uuid}/finder-tags/resync:
    servers:
      - url: /
    post:
      summary: Finder タグの再照合（ローカル・admin）
      description: |
        127.0.0.1 の口で「ローカルコントロールを許可」が ON のときだけある（共有サーバ・読書位置の同期だけの口には無く 404）。
        アプリのメニューの「Finder タグを再照合」と同じ同期を走らせ、終わるまで待って結果を返す。ユーザーのファイルの Finder タグと書庫の項目を書き換える。
        始まらなかったとき（走っている・項目が無い・アプリで施錠中など）は 200 で `status` に理由を入れる。アプリで開いていない書庫は 404。
        サーバの側では施錠を見ない（書庫の鍵は要らない。施錠中はアプリが `locked` で断る）。**admin の tier が必要。**
      tags: [Local]
      operationId: resyncFinderTags
      x-stacknest-tier: admin
      x-stacknest-lock: none
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      responses:
        '200':
          description: 再照合の結果（始まらなかったら status に理由）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinderTagResyncReply'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: この口には Finder タグの同期の仕組みが無い

  /local/libraries/{uuid}/rename-files:
    servers:
      - url: /
    post:
      summary: メタデータでファイル名を変える（ローカル・admin）
      description: |
        127.0.0.1 の口で「ローカルコントロールを許可」が ON のときだけある（共有サーバ・読書位置の同期だけの口には無く 404）。
        選んだ本のファイル名を、ファイル名の書式（`presetID` か `format`。どちらも無ければ書庫の既定のプリセット）から作り直す。`apply: true` のときだけファイルを動かし、false なら計画だけを返す。
        `presetID` と `format` を両方付けたら 400。書庫に無い ID は `missingIDs` に入れる。アプリで開いていない書庫は 404。
        `/api/v1` と同じく施錠を見る（施錠した書庫では書庫の鍵〔`X-Library-Token`〕が要る）。**admin の tier が必要。**
      tags: [Local]
      operationId: renameFiles
      x-stacknest-tier: admin
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameFilesRequest'
      responses:
        '200':
          description: 計画（apply が true なら実行の結果）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenameFilesReply'
        '400':
          description: 本文が読めない（apply が無いときを含む）・presetID と format の両方がある
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: この口にはファイル名を変える仕組みが無い
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

tags:
  - name: Server
