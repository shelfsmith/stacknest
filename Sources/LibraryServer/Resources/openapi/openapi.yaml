            type: string
        - name: field
          in: path
          required: true
          schema:
            type: string
          description: フィールド名（許可リスト外は 400）
        - name: q
          in: query
          schema:
            type: string
          description: 検索クエリ（ファセット対象を絞り込む）
        - name: scope
          in: query
          schema:
            type: string
          description: サイドバースコープ
        - name: scopeId
          in: query
          schema:
            type: integer
            format: int64
        - name: recentDays
          in: query
          schema:
            type: integer
        - name: filter
          in: query
          schema:
            type: string
          description: URL エンコードされた FilterState JSON
        - name: browse
          in: query
          schema:
            type: string
          description: URL エンコードされた BrowseConstraint 配列 JSON
      responses:
