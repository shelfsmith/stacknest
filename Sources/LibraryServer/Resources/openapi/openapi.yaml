        書庫で別の保守のジョブが走っていれば 409。進み・終わり・中断は complete-metadata と同じ（`maintenance/status`・SSE・`maintenance/cancel`）。
        **admin の tier が必要。** 施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
      tags: [Maintenance]
