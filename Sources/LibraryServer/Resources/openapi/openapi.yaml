  /libraries/{lib}/books/{id}/progress:
    post:
      summary: 閲覧進行状況の書き込み（lastPage・mark-as-read）
      description: |
        本専用の鍵でも通る（その本に限る）。
        閲覧進行状況（last_page）を書き込み、mark-as-read（unseen=false / play_date=now）を実行する。
        **read の tier でも可（共有閲覧状態の更新）。**
        サーバを動かしているアプリの画面には反映するが、SSE（`GET /events`）のイベントは出さない。

        **破損（部分読み）本の保護（G26）:** 全ページを読めない本（manifest の `damageNote` が
        非 null）では、クライアントの表示位置が読める範囲の末尾へクランプされる。この値をそのまま
        書くと保存済みの読書位置が失われるため、サーバは **保存済み `last_page` より手前への
        書き込みを無視**する（現在値を維持して 200 を返す）。前進方向の書き込みと、破損していない
        本の書き込みは従来どおり常に反映される。ユーザーが明示的に「最初から」を選んだ場合のみ
        `restart: true` を送ることで、この保護を解除して後退書き込みを反映させる。
      tags: [Viewer]
      operationId: saveProgress
      x-stacknest-tier: read
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page]
              properties:
                page:
                  type: integer
                  minimum: 0
                  description: 最終閲覧ページ（0 始まり）
                restart:
                  type: boolean
                  default: false
                  description: |
                    ユーザーが明示的に「最初から」を選んだことを表す（省略可・既定 false）。
                    true のとき破損本の後退書き込み保護を解除する。
                    **`page == 0` から推測してはならない**（0 は単に 1 ページ目でもある）。
      responses:
        '200':
          description: 書き込み成功
        '400':
          description: page が負数
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LibraryLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /libraries/{lib}/books/{id}/viewer-token:
    post:
      summary: 本専用の読み取りトークンの発行（G60）
      description: |
        対応した外部ビューアへ渡す、その 1 冊専用のトークンを発行する。
        このトークンでできるのは、その本の `GET manifest`・`GET pages/{n}`・`GET cover`・`POST progress` だけで、
        ほかの API・別の本・別の書庫はすべて 403。有効期限は 30 日で、過ぎると 401。
        発行した口（共有サーバ／127.0.0.1 の口）でだけ使え、`Authorization: Bearer` のヘッダでだけ受け付ける。
        発行元のグラントを削除する（またはその書庫を scope から外す）と、そのグラントで発行したトークンは 401 になる。
        サーバはトークンのハッシュ（SHA-256）だけを保存する。
        **read の tier でも可。ただし本専用の鍵では 403。** 施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
        発行したトークンは、その本に限ってライブラリトークンなしで読める（解錠に使ったパスワードの世代に結び付き、
        パスワードが変わると読めなくなる）。
        応答の `tokenID`（秘密ではない）で、発行した主体が `GET /viewer-tokens/{tokenID}` から使われたかを確かめられる。
        対応ビューアは、このトークンで呼ぶ要求すべてに `X-StackNest-Viewer: <bundle id>/<版>; format=<版>[; kit=<StackNestViewerKit の版>]` を付ける
        （無くても拒まない。初めて通った要求の日時と値を一度だけ記録する。`kit=` は StackNestViewerKit が付け、記録する値にそのまま残る）。
        参照ファイル（`.stacknestbook`）の形式は StackNestViewerKit の文書（https://github.com/shelfsmith/StackNestViewerKit/blob/main/Documentation/BookReferenceFormat.md）を参照。
      tags: [Viewer]
      operationId: issueViewerToken
      x-stacknest-tier: read
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerTokenReply'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: このサーバでは発行できない
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /viewer-tokens/{tokenID}:
    get:
      summary: 本専用トークンが使われたかの照会（G60 v3）
      description: |
        `POST /libraries/{lib}/books/{id}/viewer-token` で発行したトークンが、対応ビューアに使われたかを返す。
        読めるのは発行した主体だけ（同じグラント。固定トークンで発行したものは固定トークンで）で、その書庫が今の scope に入っていること。
        本専用トークン自身では呼べない（403）。scope の外の書庫の記録・発行した主体でない鍵も 403。404 は、その ID のトークンが無いとき（期限切れで消えた・別の口で発行した）だけで、scope の外の書庫は 404 でなく 403。応答に本の中身は無いので、ロック庫でも `X-Library-Token` は要らない。
        固定トークン（グラント無し）で動かしているサーバでは主体が区別できないので、同じトークンを持つ接続はどれも、
        そのトークンで発行した本専用トークンの使用の状況（日時と名乗りだけ）を読める。
      tags: [Viewer]
      operationId: getViewerTokenStatus
      x-stacknest-tier: read
      x-stacknest-lock: none
      parameters:
        - name: tokenID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 照会した（Cache-Control は no-store）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerTokenStatusReply'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: このサーバでは発行していない

  /relay/{relayID}/manifest:
    get:
      summary: リモートの本の中継（manifest・G60 v3）
      description: |
        **127.0.0.1 の口（ローカルコントロールの受け口）で中継を設定したときだけ**ある道（共有サーバには無い・中継の鍵だけが通る・G60 v3 試用）。
        リモートの本を参照ファイルで外部ビューアへ渡すとき、`book` は `http://127.0.0.1:<port>/api/v1/relay/<relayID>` になり、
        StackNest がリモートのサーバへ取り次ぐ（リモートの本専用トークンを付ける。それはビューアに渡らない）。
        使えるのは、その中継のために出した本専用トークン（中継のトークン）だけで、`Authorization: Bearer` のヘッダでだけ受け付ける。
        ほかのトークン・別の中継のトークンは 403。StackNest を終了した後や期限の後は中継の記録が無いので 401。リモートが 401・403 で断ったら、その応答を返したうえで中継を閉じるので、以後は 401（キャッシュにあるページも返さない・G60 §5.9）。
        リモートの応答の状態コードと本文、`Content-Type`・`ETag`・`X-Library-Locked` をそのまま返す。
        リモートに届かない・リダイレクト・本文が上限（64 MiB）を超えた場合は 502。
        リモートの `GET /libraries/{lib}/books/{id}/manifest` を取り次ぐ。
      tags: [Viewer]
      operationId: getRelayManifest
      x-stacknest-tier: relay
      parameters:
        - name: relayID
          in: path
          required: true
          schema:
            type: string
          description: 中継の ID（参照ファイルの `book` の最後の階層）
        - name: pageNames
          in: query
          schema:
            type: string
            enum: ['1']
          description: '`1` ならリモートへもそのまま頼む（ページの名前。ほかのクエリは取り次がない）'
      responses:
        '200':
          description: リモートの書籍マニフェスト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: リモートに届かない・リダイレクト・本文が上限を超えた

  /relay/{relayID}/pages/{n}:
    get:
      summary: リモートの本の中継（ページ画像・G60 v3）
      description: |
        **127.0.0.1 の口（ローカルコントロールの受け口）で中継を設定したときだけ**ある道（共有サーバには無い・中継の鍵だけが通る・G60 v3 試用）。
        リモートの本を参照ファイルで外部ビューアへ渡すとき、`book` は `http://127.0.0.1:<port>/api/v1/relay/<relayID>` になり、
        StackNest がリモートのサーバへ取り次ぐ（リモートの本専用トークンを付ける。それはビューアに渡らない）。
        使えるのは、その中継のために出した本専用トークン（中継のトークン）だけで、`Authorization: Bearer` のヘッダでだけ受け付ける。
        ほかのトークン・別の中継のトークンは 403。StackNest を終了した後や期限の後は中継の記録が無いので 401。リモートが 401・403 で断ったら、その応答を返したうえで中継を閉じるので、以後は 401（キャッシュにあるページも返さない・G60 §5.9）。
        `maxw` が無い（または 1600 の）要求は、StackNest の内蔵ビューアと分け合うページのキャッシュから返す（G60 §5.9）。
        キャッシュに無ければ、内蔵ビューアと同じ形（`maxw=1600` と版の `v`）でリモートから取って入れる（リモートが `no-store` を返したら入れない）。
        このときの応答は画像と `Content-Type` だけで `ETag` は付けず、`If-None-Match` はリモートへ渡さない。幅が 1600 ピクセルを超えるページは、内蔵ビューアと同じく長い辺が 1600 ピクセル以内になるように縮み、JPEG に変換されて届く（PNG・WebP も）。
        リモートが 200 以外を返したら、状態コードと本文、`Content-Type`・`ETag`・`X-Library-Locked` をそのまま返す。
        ほかの正の整数の `maxw` は今までどおり取り次ぐ（キャッシュしない）。リモートの応答の状態コードと本文、`Content-Type`・`ETag`・`X-Library-Locked` をそのまま返し、`If-None-Match` を渡して 304 もそのまま返す。
        リモートに届かない・リダイレクト・本文が上限（64 MiB）を超えた場合は 502。
        リモートの `GET /libraries/{lib}/books/{id}/pages/{n}` を取り次ぐ。
      tags: [Viewer]
      operationId: getRelayPage
      x-stacknest-tier: relay
      parameters:
        - name: relayID
          in: path
          required: true
          schema:
            type: string
          description: 中継の ID（参照ファイルの `book` の最後の階層）
        - name: 'n'
          in: path
          required: true
          schema:
            type: integer
          description: ページインデックス（0 始まり）
        - name: maxw
          in: query
          schema:
            type: integer
          description: 最大幅（px）。無い・1600・正の整数でない値は、内蔵ビューアと同じ幅でキャッシュから返す。ほかの正の整数はリモートへ渡す（キャッシュしない）
      responses:
        '200':
          description: ページ画像バイナリ
          content:
            image/*:
              schema:
                type: string
                format: binary
        '304':
          description: 変更なし（1600 以外の maxw を付けて取り次いだ要求で、If-None-Match が一致）
        '400':
          description: "`n` が数でない"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: リモートでページ範囲外（リモートの応答をそのまま返す。この道自体の書庫・本の解決はしない）
        '502':
          description: リモートに届かない・リダイレクト・本文が上限を超えた

  /relay/{relayID}/cover:
    get:
      summary: リモートの本の中継（表紙・G60 v3）
      description: |
        **127.0.0.1 の口（ローカルコントロールの受け口）で中継を設定したときだけ**ある道（共有サーバには無い・中継の鍵だけが通る・G60 v3 試用）。
        リモートの本を参照ファイルで外部ビューアへ渡すとき、`book` は `http://127.0.0.1:<port>/api/v1/relay/<relayID>` になり、
        StackNest がリモートのサーバへ取り次ぐ（リモートの本専用トークンを付ける。それはビューアに渡らない）。
        使えるのは、その中継のために出した本専用トークン（中継のトークン）だけで、`Authorization: Bearer` のヘッダでだけ受け付ける。
        ほかのトークン・別の中継のトークンは 403。StackNest を終了した後や期限の後は中継の記録が無いので 401。リモートが 401・403 で断ったら、その応答を返したうえで中継を閉じるので、以後は 401（キャッシュにあるページも返さない・G60 §5.9）。
        リモートの応答の状態コードと本文、`Content-Type`・`ETag`・`X-Library-Locked` をそのまま返す。
        リモートに届かない・リダイレクト・本文が上限（64 MiB）を超えた場合は 502。
        リモートの `GET /libraries/{lib}/books/{id}/cover` を取り次ぐ。
      tags: [Viewer]
      operationId: getRelayCover
      x-stacknest-tier: relay
      parameters:
        - name: relayID
          in: path
          required: true
          schema:
            type: string
          description: 中継の ID（参照ファイルの `book` の最後の階層）
      responses:
        '200':
          description: 表紙画像
          content:
            image/*:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: リモートに届かない・リダイレクト・本文が上限を超えた

  /relay/{relayID}/progress:
    post:
      summary: リモートの本の中継（読書位置の書き込み・G60 v3）
      description: |
        **127.0.0.1 の口（ローカルコントロールの受け口）で中継を設定したときだけ**ある道（共有サーバには無い・中継の鍵だけが通る・G60 v3 試用）。
        リモートの本を参照ファイルで外部ビューアへ渡すとき、`book` は `http://127.0.0.1:<port>/api/v1/relay/<relayID>` になり、
        StackNest がリモートのサーバへ取り次ぐ（リモートの本専用トークンを付ける。それはビューアに渡らない）。
        使えるのは、その中継のために出した本専用トークン（中継のトークン）だけで、`Authorization: Bearer` のヘッダでだけ受け付ける。
        ほかのトークン・別の中継のトークンは 403。StackNest を終了した後や期限の後は中継の記録が無いので 401。リモートが 401・403 で断ったら、その応答を返したうえで中継を閉じるので、以後は 401（キャッシュにあるページも返さない・G60 §5.9）。
        リモートの応答の状態コードと本文、`Content-Type`・`ETag`・`X-Library-Locked` をそのまま返す。
        リモートに届かない・リダイレクト・本文が上限（64 MiB）を超えた場合は 502。
        リモートの `POST /libraries/{lib}/books/{id}/progress` を取り次ぐ（本文はそのまま渡す）。
        本文が 64 KiB を超えたら 413 で、リモートへは送らない。
      tags: [Viewer]
      operationId: saveRelayProgress
      x-stacknest-tier: relay
      parameters:
        - name: relayID
          in: path
          required: true
          schema:
            type: string
          description: 中継の ID（参照ファイルの `book` の最後の階層）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page]
              properties:
                page:
                  type: integer
                  minimum: 0
                  description: 最終閲覧ページ（0 始まり）
      responses:
        '200':
          description: 書き込み成功（リモートの応答）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: 本文が 64 KiB を超えた
        '502':
          description: リモートに届かない・リダイレクト

  /libraries/{lib}/books/{id}/epub-progress:
    post:
      summary: EPUB 読書位置の書き込み（G48-2・mark-as-read）
      description: |
        EPUB の読書位置（spine index・進捗率・任意で CFI/engine）を後勝ちで書き込み、
        mark-as-read（unseen=false / play_date=now）を実行する。**read の tier でも可**
        （`/progress` と同じく共有閲覧状態の更新）。`/progress` と同じく、サーバを動かしているアプリの画面には
        反映するが、SSE（`GET /events`）のイベントは出さない。`spine` は 0 未満を 0 に、`progress` は範囲外
        （0 未満・1 超）を [0, 1] にクランプする（値型が丸めるため 400 にはならない）。
      tags: [Viewer]
      operationId: saveEpubProgress
      x-stacknest-tier: read
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spine, progress]
              properties:
                spine:
                  type: integer
                  description: spine（章）インデックス（0 始まり・負数は 0 にクランプ）
                progress:
                  type: number
                  format: double
                  description: 章内の読書進捗率（0.0〜1.0・範囲外はクランプ）
                cfi:
                  type: [string, 'null']
                  description: EPUB CFI（任意・エンジンが対応する場合のみ）
                engine:
                  type: [string, 'null']
                  description: 生成元のレンダリングエンジン識別子（任意）
      responses:
        '200':
          description: 書き込み成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LibraryLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /libraries/{lib}/books/{id}/direction:
