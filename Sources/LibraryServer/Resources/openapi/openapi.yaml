  /libraries/{lib}/books/{id}:
    patch:
      summary: 書籍メタデータ更新（edit 以上）
      description: |
        書籍のメタデータを部分更新する。null フィールドは変更しない。
        `clear*` フラグが true のフィールドは NULL 化する。
        **edit 以上の tier が必要。**
        更新したら `bookChanged` イベントを出す。
      tags: [Books]
      operationId: updateBook
      x-stacknest-tier: edit
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookPatchDTO'
      responses:
        '200':
          description: 更新後の書籍詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LibraryUnavailable'
    delete:
      summary: 書籍削除（エントリ＋サムネ・edit 以上、`?trash=true` は admin）
      description: |
        書籍エントリとサムネイルを削除する。
        `?trash=true` を付けると実ファイルをゴミ箱に送る（サーバが trashFile をサポートしている場合のみ）。このときは admin の tier が要る（edit では 403）。
        **edit 以上の tier が必要。**
        削除したら `structureChanged` イベントを出す。
      tags: [Books]
      operationId: deleteBook
      x-stacknest-tier: edit
      x-stacknest-tier-note: '?trash=true のときは admin'
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: trash
          in: query
          schema:
            type: boolean
          description: true で実ファイルをゴミ箱へ（サーバサポート外は 501）
      responses:
        '200':
          description: 削除した行（リモートの undo 用。`POST /libraries/{lib}/books/restore` の本文にそのまま使える）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRestoreDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: ゴミ箱機能が未サポート（Linux/ヘッドレス環境）
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /libraries/{lib}/books/restore:
    post:
      summary: 削除した本を戻す（admin）
      description: |
        `DELETE /libraries/{lib}/books/{id}` が返した行（`BookRestoreDTO`）の配列を受け取り、同じ ID で書庫に戻す（リモートの取り消し）。
        ID が他の本に使われていたら、その行は飛ばして続ける。パスは、このサーバが消したときに記録したものを優先し、記録が無ければ許したルート（書庫のバンドル・監視フォルダ・今ある本のフォルダ）の中のときだけ使う（外なら行は戻すがパスは落とす）。
        ゴミ箱に送ったファイルは、サーバが記録した元の場所へ戻す（本文のパスは使わない）。消したときに表紙があった本は表紙を作り直す。
        1 冊でも戻したら `structureChanged` イベントを出す。**admin の tier が必要。** 施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
      tags: [Books]
      operationId: restoreBook
      x-stacknest-tier: admin
      security:
        - bearerAuth: []
          libraryToken: []
        - bearerAuth: []
      parameters:
        - name: lib
          in: path
          required: true
          schema:
            type: string
          description: ライブラリ UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BookRestoreDTO'
      responses:
        '200':
          description: 戻した結果（戻せなかった行があれば restored < requested）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResultDTO'
        '400':
          description: 本文が読めない
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrLocked'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LibraryUnavailable'

  /libraries/{lib}/books/{id}/relink:
    post:
      summary: 本のファイルの付け直し（edit 以上）
      description: |
        本のファイルのパスを付け直す（内容のハッシュは消す）。自動の表紙は新しいファイルから作り直し、ページ数も新しいファイルの数にする（手動・外部の表紙はそのまま。作り直しの失敗は付け直しの失敗にしない）。
        新しいパスが許したルート（書庫のバンドル・監視フォルダ・今ある本のフォルダ）の外なら 403（施錠による 403 ではないので `X-Library-Locked` は付かない）。
        `structureChanged` イベントを出す。**edit 以上の tier が必要。** 施錠した書庫では書庫の鍵（`X-Library-Token`）が要る。
      tags: [Books]
      operationId: relinkBook
